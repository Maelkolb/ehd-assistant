<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humboldt RAG — Forschungsassistent</title>
<style>
:root{--primary:#2c5530;--bg:#fafaf8;--text:#2a2a2a;--border:#ddd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--primary);color:#fff;padding:1rem 1.5rem}
header h1{font-size:1.2rem;font-weight:500}
header .sub{font-size:.85rem;opacity:.8;font-style:italic}
.chat{flex:1;overflow-y:auto;padding:1.5rem;max-width:800px;margin:0 auto;width:100%}
.msg{margin-bottom:1.5rem;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{text-align:right}
.msg.user .b{background:var(--primary);color:#fff;display:inline-block;padding:.75rem 1.25rem;border-radius:1.25rem 1.25rem .25rem 1.25rem;max-width:75%;text-align:left}
.msg.bot .b{background:#fff;border:1px solid var(--border);padding:1rem 1.25rem;border-radius:.25rem 1.25rem 1.25rem 1.25rem;line-height:1.7}
.src-ref{color:var(--primary);font-weight:600;font-size:.85em}
.sources{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);font-size:.85rem;color:#666}
.sources a{color:var(--primary)}
.typing span{width:6px;height:6px;background:#666;border-radius:50%;display:inline-block;animation:t 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.input-area{border-top:1px solid var(--border);padding:1rem 1.5rem;background:#fff}
.input-wrap{max-width:800px;margin:0 auto;display:flex;gap:.75rem}
.input-wrap input{flex:1;padding:.75rem 1rem;border:1px solid var(--border);border-radius:.75rem;font-family:inherit;font-size:1rem;outline:none}
.input-wrap input:focus{border-color:var(--primary)}
.input-wrap button{padding:.75rem 1.5rem;background:var(--primary);color:#fff;border:none;border-radius:.75rem;font-family:inherit;font-size:1rem;cursor:pointer}
.input-wrap button:disabled{opacity:.5}
.welcome{text-align:center;padding:3rem 1rem;color:#666}
.welcome h2{color:var(--text);margin-bottom:.5rem}
.examples{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.examples button{padding:.5rem 1rem;background:#e8f0e9;border:1px solid #c8d8ca;border-radius:2rem;font-family:inherit;font-size:.85rem;cursor:pointer;color:var(--primary)}
</style>
</head>
<body>
<header><h1>edition humboldt digital</h1><div class="sub">Forschungsassistent</div></header>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<h2>Fragen Sie die Quellen</h2>
<p style="max-width:500px;margin:0 auto 1rem;line-height:1.6">Ich durchsuche die Reisetagebücher, Briefe und Dokumente Alexander von Humboldts.</p>
<div class="examples">
<button onclick="ask(this)">Welche Messungen machte Humboldt am Königstein?</button>
<button onclick="ask(this)">Wen traf Humboldt in Wien?</button>
<button onclick="ask(this)">Wer war Bonpland?</button>
<button onclick="ask(this)">Was bedeutet "alii dicunt"?</button>
</div></div></div>
<div class="input-area"><div class="input-wrap">
<input id="q" placeholder="Stellen Sie eine Frage..." onkeydown="if(event.key==='Enter')send()" autofocus>
<button id="btn" onclick="send()">Senden</button>
</div></div>
<script>
const API=window.location.origin,chat=document.getElementById('chat'),q=document.getElementById('q'),btn=document.getElementById('btn'),wel=document.getElementById('welcome');
function ask(b){q.value=b.textContent;send()}
async function send(){const t=q.value.trim();if(!t)return;if(wel)wel.style.display='none';add('user',t);q.value='';btn.disabled=true;
const ty=document.createElement('div');ty.className='msg bot';ty.innerHTML='<div class="b typing"><span></span><span></span><span></span></div>';chat.appendChild(ty);chat.scrollTop=1e6;
try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:t,top_k:8})});const d=await r.json();ty.remove();
let a=(d.answer||'Keine Antwort.').replace(/\[Quelle\s+(\d+)\]/g,'<span class="src-ref">[Quelle $1]</span>');
let s='';if(d.sources&&d.sources.length){s='<div class="sources"><b>Quellen:</b><br>';d.sources.forEach(x=>{const l=x.citation_label||'Quelle '+x.index;s+=`[${x.index}] ${x.url?'<a href="'+x.url+'" target="_blank">'+l+'</a>':l}<br>`});s+='</div>'}
add('bot',a+s)}catch(e){ty.remove();add('bot','Fehler: '+e.message)}btn.disabled=false;q.focus()}
function add(r,h){const d=document.createElement('div');d.className='msg '+r;d.innerHTML='<div class="b">'+(r==='user'?esc(h):h)+'</div>';chat.appendChild(d);chat.scrollTop=1e6}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
</script>
</body></html>
