<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — ehd-assistant</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--primary:#2c5530;--bg:#fafaf8;--text:#2a2a2a;--border:#ddd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--primary);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.2rem;font-weight:500}
header .sub{font-size:.85rem;opacity:.8;font-style:italic}
.lang-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:.35rem .8rem;border-radius:2rem;font-family:inherit;font-size:.8rem;cursor:pointer}
.lang-btn:hover{background:rgba(255,255,255,.25)}
.chat{flex:1;overflow-y:auto;padding:1.5rem;max-width:800px;margin:0 auto;width:100%}
.msg{margin-bottom:1.5rem;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{text-align:right}
.msg.user .b{background:var(--primary);color:#fff;display:inline-block;padding:.75rem 1.25rem;border-radius:1.25rem 1.25rem .25rem 1.25rem;max-width:75%;text-align:left}
.msg.bot .b{background:#fff;border:1px solid var(--border);padding:1rem 1.25rem;border-radius:.25rem 1.25rem 1.25rem 1.25rem;line-height:1.7}
.src-ref{color:var(--primary);font-weight:600;font-size:.85em}
.sources{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);font-size:.85rem;color:#666}
.sources a{color:var(--primary)}
.cited{border-bottom:1px dotted #9db89f}
.cite-chip{background:#e8f0e9;border:1px solid #c8d8ca;border-radius:.6rem;font-size:.68rem;padding:0 .35rem;margin:0 .1rem;color:var(--primary);cursor:pointer;font-family:inherit;line-height:1.2;vertical-align:super}
.cite-chip:hover{background:#d3e3d5}
.cite-chip.ed{background:#faf3e0;border-color:#e0d0a8;color:#8a6d1a}
.sp-open-btn{background:none;border:none;cursor:pointer;font-size:.85rem;padding:0 .25rem;opacity:.55}
.sp-open-btn:hover{opacity:1}
#sp-backdrop{position:fixed;inset:0;background:rgba(22,32,24,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:999}
#sp-backdrop.open{opacity:1;pointer-events:auto}
#spanel{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:#fff;border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.16);transform:translateX(103%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column}
#spanel.open{transform:translateX(0)}
.sp-head{padding:.9rem 1.1rem .8rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;background:#f4f6f4}
.sp-badge{display:inline-block;color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.05em;padding:.14rem .6rem;border-radius:1rem;margin-bottom:.4rem;text-transform:uppercase}
.sp-head b{font-size:1rem;color:var(--text);display:block;line-height:1.35}
.sp-head .sp-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;line-height:1;padding:.1rem .3rem;border-radius:.4rem}
.sp-head .sp-close:hover{background:#e4eae4;color:#333}
.sp-meta{font-size:.78rem;color:#777;margin-top:.3rem}
.sp-body{flex:1;overflow-y:auto;padding:1rem 1.1rem;font-size:.93rem;line-height:1.8}
.sp-cith{font-size:.73rem;color:#8a6d1a;margin:0 0 .55rem;display:flex;align-items:center;gap:.45rem;font-weight:600}
.sp-cith::before{content:'';flex:0 0 16px;height:9px;background:#f5e9a8;border-radius:2px}
.sp-paper{background:#fdfcf6;border:1px solid #e8e4d6;border-radius:.55rem;padding:.95rem 1.05rem;box-shadow:inset 0 1px 4px rgba(0,0,0,.03)}
.sp-body mark{background:linear-gradient(transparent 12%,#f5e9a8 12%,#f5e9a8 92%,transparent 92%);padding:0 .12rem;border-radius:3px}
details.sp-notes{margin-top:1rem;border-top:1px dashed var(--border);padding-top:.7rem}
details.sp-notes summary{cursor:pointer;font-size:.8rem;color:#8a6d1a;font-weight:600;margin-bottom:.45rem;user-select:none}
details.sp-notes summary:hover{color:#6d5510}
.sp-notes .nt{font-size:.83rem;color:#5c5648;background:#faf8f0;border-left:3px solid #e0d0a8;padding:.45rem .65rem;margin-bottom:.4rem;border-radius:0 .35rem .35rem 0;line-height:1.6}
.sp-notes .nt mark{background:#f5e9a8}
.sp-shelf{margin-top:.9rem;font-size:.74rem;color:#999;font-style:italic}
.sp-foot{padding:.75rem 1.1rem;border-top:1px solid var(--border);display:flex;gap:.6rem;flex-wrap:wrap;background:#fafaf8}
.sp-foot a,.sp-foot button{font-size:.8rem;color:var(--primary);background:#eef3ee;border:1px solid #c8d8ca;border-radius:2rem;padding:.4rem 1rem;text-decoration:none;cursor:pointer;font-family:inherit}
.sp-foot a.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.sp-foot a.pri:hover{background:#234426}
.sp-foot button:hover,.sp-foot a:not(.pri):hover{background:#dfe9e0}
.net-canvas{width:100%;height:420px;display:block;cursor:grab}
.net-legend{display:flex;gap:.9rem;flex-wrap:wrap;padding:.45rem .75rem;font-size:.75rem;color:#555;background:#f9faf9;border-top:1px solid #eee}
.net-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.3rem}
.net-tip{position:absolute;pointer-events:none;background:#2a2a2a;color:#fff;font-size:.75rem;padding:.25rem .55rem;border-radius:.35rem;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
.copy-btn{background:none;border:none;cursor:pointer;font-size:.85rem;padding:0 .25rem;opacity:.55}
.copy-btn:hover{opacity:1}
.a-actions{margin-top:.6rem;display:flex;gap:.6rem;align-items:center}
.a-actions button{background:#eef3ee;border:1px solid #c8d8ca;border-radius:2rem;padding:.3rem .9rem;font-family:inherit;font-size:.78rem;color:var(--primary);cursor:pointer}
.a-actions button:hover{background:#e0ebe1}
.chips{margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem}
.chips button{padding:.4rem .9rem;background:#e8f0e9;border:1px solid #c8d8ca;border-radius:2rem;font-family:inherit;font-size:.8rem;cursor:pointer;color:var(--primary)}
.chips button:hover{background:#dbe8dc}
.live{white-space:pre-wrap;color:#444}
.trace{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;color:#555;line-height:1.9}
.trace .tl{display:block}
.trace .tool{color:var(--primary);font-weight:600}
.trace .args{color:#777}
.trace .res{color:#997a00}
.trace .pending::after{content:'…';animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
details.trace-box{margin-bottom:.75rem;padding:.5rem .75rem;background:#f4f6f4;border:1px solid #e0e6e0;border-radius:.5rem}
details.trace-box summary{cursor:pointer;font-size:.8rem;color:#557055;font-family:ui-monospace,Menlo,Consolas,monospace}
.artifact{margin-top:1rem;border:1px solid var(--border);border-radius:.5rem;overflow:hidden}
.artifact .a-title{background:#f4f6f4;padding:.5rem .75rem;font-size:.85rem;font-weight:600;color:#446644;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.a-btns{display:flex;gap:.35rem;flex-shrink:0}
.a-btns button{background:#fff;border:1px solid #c8d8ca;border-radius:.4rem;padding:.1rem .5rem;font-size:.72rem;color:var(--primary);cursor:pointer;font-family:inherit;font-weight:400}
.a-btns button:hover{background:#e8f0e9}
.artifact:fullscreen{background:#fff;display:flex;flex-direction:column}
.artifact:fullscreen .map-div{flex:1;height:auto}
.artifact .map-div{height:380px;width:100%}
.artifact img{max-width:100%;display:block}
.tline .yr{font-weight:700;color:var(--primary);font-size:.82rem;letter-spacing:.06em;margin:.7rem 0 .55rem;font-family:ui-monospace,monospace}
.tline .yr .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.45rem;vertical-align:baseline}
.tline .ev-body{padding:.1rem .4rem;border-radius:.35rem;transition:background .15s}
.tline .ev:hover .ev-body{background:#f0f4f0}
.map-marker{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tline{padding:.75rem 1rem}
.tline .ev{display:flex;gap:.75rem;position:relative;padding-bottom:.9rem}
.tline .ev::before{content:'';position:absolute;left:4.7rem;top:1.2rem;bottom:0;width:2px;background:#c8d8ca}
.tline .ev:last-child::before{display:none}
.tline .dt{flex:0 0 4.2rem;text-align:right;font-size:.75rem;color:var(--primary);font-weight:700;font-family:ui-monospace,monospace;padding-top:.1rem}
.tline .dot{flex:0 0 12px;height:12px;border-radius:50%;background:var(--primary);margin-top:.2rem;z-index:1}
.tline .ev-body{flex:1;font-size:.88rem;line-height:1.5}
.tline .ev-body .lbl{font-weight:600}
.tline .ev-body .dsc{color:#666;font-size:.82rem}
.tline .ev-body a{color:var(--primary);font-size:.78rem}
.typing span{width:6px;height:6px;background:#666;border-radius:50%;display:inline-block;animation:t 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.input-area{border-top:1px solid var(--border);padding:1rem 1.5rem;background:#fff}
.input-wrap{max-width:800px;margin:0 auto;display:flex;gap:.75rem}
.input-wrap input{flex:1;padding:.75rem 1rem;border:1px solid var(--border);border-radius:.75rem;font-family:inherit;font-size:1rem;outline:none}
.input-wrap input:focus{border-color:var(--primary)}
.input-wrap select{padding:.75rem .5rem;border:1px solid var(--border);border-radius:.75rem;font-family:inherit;font-size:.85rem;background:#fff;color:#555;outline:none;cursor:pointer;max-width:11rem}
.input-wrap select:focus{border-color:var(--primary)}
.input-wrap button{padding:.75rem 1.5rem;background:var(--primary);color:#fff;border:none;border-radius:.75rem;font-family:inherit;font-size:1rem;cursor:pointer}
.input-wrap button:disabled{opacity:.5}
.input-wrap .reset-btn{background:#fff;color:#888;border:1px solid var(--border);padding:.75rem .9rem}
.input-wrap .reset-btn:hover{color:var(--primary);border-color:var(--primary)}
.welcome{text-align:center;padding:3rem 1rem;color:#666}
.welcome h2{color:var(--text);margin-bottom:.5rem}
.examples{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.examples button{padding:.5rem 1rem;background:#e8f0e9;border:1px solid #c8d8ca;border-radius:2rem;font-family:inherit;font-size:.85rem;cursor:pointer;color:var(--primary)}
</style>
</head>
<body>
<header>
<div><h1>edition humboldt digital</h1><div class="sub" id="sub"></div></div>
<button class="lang-btn" id="langbtn" onclick="toggleLang()"></button>
</header>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<h2 id="wh"></h2>
<p id="wp" style="max-width:500px;margin:0 auto 1rem;line-height:1.6"></p>
<div class="examples" id="examples"></div>
</div></div>
<div id="sp-backdrop" onclick="closePanel()"></div>
<div id="spanel" aria-hidden="true">
<div class="sp-head"><div style="min-width:0"><span class="sp-badge" id="sp-badge" style="display:none"></span><b id="sp-title"></b><div class="sp-meta" id="sp-meta"></div></div><button class="sp-close" onclick="closePanel()">×</button></div>
<div class="sp-body" id="sp-body"></div>
<div class="sp-foot" id="sp-foot"></div>
</div>
<div class="input-area"><div class="input-wrap">
<button class="reset-btn" id="resetbtn" onclick="resetChat()" title="">↺</button>
<select id="model" title="Claude"></select>
<input id="q" onkeydown="if(event.key==='Enter')send()" autofocus>
<button id="btn" onclick="send()"></button>
</div></div>
<script>
const I18N={
 de:{sub:'Alex · Forschungsassistent',wh:'Fragen Sie Alex',
     wp:'Ich bin Alex und durchsuche die Reisetagebücher, Briefe und Dokumente Alexander von Humboldts.',
     placeholder:'Stellen Sie eine Frage...',send:'Senden',sources:'Quellen:',
     steps:'Recherche-Schritte',hits:'Treffer',error:'Fehler',noanswer:'Keine Antwort.',
     share:'🔗 Link teilen',linkCopied:'✓ Link kopiert',citeTip:'Zitat kopieren',citeCopied:'✓ Zitat kopiert',
     followups:'Weiterfragen:',reset:'Neues Gespräch',accessed:'abgerufen am',
     spNotes:'Editorische Anmerkungen',spOpen:'Im Original öffnen ↗',spCited:'Zitierte Stelle hervorgehoben',spView:'Quelle ansehen',spLoading:'Lade Quelle…',spEd:'Editorischer Kommentar',
     exportTip:'Als eigenständige HTML-Datei herunterladen',fullscreenTip:'Vollbild',
     models:{'claude-haiku-4-5':'Haiku (schnell)','claude-sonnet-5':'Sonnet (ausgewogen)','claude-opus-4-8':'Opus (gründlich)'},
     tools:{lookup_entity:'📇 Register',chunks_for_entity:'🔗 Annotierte Stellen',search:'🔍 Suche',grep:'⌕ Grep',get_context:'📄 Kontext',where_was_humboldt:'📅 Chronologie',create_map:'🗺️ Karte',create_timeline:'📈 Zeitleiste',create_network:'🕸️ Netzwerk',get_document:'📜 Dokument',query_measurements:'📏 Messwerte',code_execution:'🐍 Code',repair_citations:'🩹 Zitate nachtragen'},
     examples:['Welche Messungen machte Humboldt am Königstein?','Wen traf Humboldt in Wien?','Wer war Bonpland?','Erstelle eine Karte der Italienreise 1805']},
 en:{sub:'Alex · Research Assistant',wh:'Ask Alex',
     wp:"I'm Alex — I search Alexander von Humboldt's travel journals, letters and documents.",
     placeholder:'Ask a question...',send:'Send',sources:'Sources:',
     steps:'Research steps',hits:'results',error:'Error',noanswer:'No answer.',
     share:'🔗 Share link',linkCopied:'✓ Link copied',citeTip:'Copy citation',citeCopied:'✓ Citation copied',
     followups:'Follow up:',reset:'New conversation',accessed:'accessed',
     spNotes:'Editorial notes',spOpen:'Open in the edition ↗',spCited:'Cited passage highlighted',spView:'View source',spLoading:'Loading source…',spEd:'Editorial note',
     exportTip:'Download as standalone HTML file',fullscreenTip:'Fullscreen',
     models:{'claude-haiku-4-5':'Haiku (fast)','claude-sonnet-5':'Sonnet (balanced)','claude-opus-4-8':'Opus (thorough)'},
     tools:{lookup_entity:'📇 Index',chunks_for_entity:'🔗 Annotated passages',search:'🔍 Search',grep:'⌕ Grep',get_context:'📄 Context',where_was_humboldt:'📅 Chronology',create_map:'🗺️ Map',create_timeline:'📈 Timeline',create_network:'🕸️ Network',get_document:'📜 Document',query_measurements:'📏 Measurements',code_execution:'🐍 Code',repair_citations:'🩹 Repairing citations'},
     examples:['What measurements did Humboldt take at the Königstein?','Whom did Humboldt meet in Vienna?','Who was Bonpland?','Create a map of the 1805 Italy journey']}
};
let LANG=localStorage.getItem('humboldt_lang')||'de';
let convo=[];  // [{role, content}] — client-held conversation history
const API=window.location.origin,chat=document.getElementById('chat'),q=document.getElementById('q'),btn=document.getElementById('btn'),wel=document.getElementById('welcome');
function T(){return I18N[LANG]}
function applyLang(){
  const t=T();document.documentElement.lang=LANG;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('langbtn').textContent=LANG==='de'?'English':'Deutsch';
  document.getElementById('wh').textContent=t.wh;
  document.getElementById('wp').textContent=t.wp;
  q.placeholder=t.placeholder;btn.textContent=t.send;
  document.getElementById('resetbtn').title=t.reset;
  const ex=document.getElementById('examples');ex.innerHTML='';
  t.examples.forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>ask(b);ex.appendChild(b)});
  const sel=document.getElementById('model'),cur=sel.value||'claude-haiku-4-5';sel.innerHTML='';
  Object.entries(t.models).forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===cur)o.selected=true;sel.appendChild(o)});
}
function toggleLang(){LANG=LANG==='de'?'en':'de';localStorage.setItem('humboldt_lang',LANG);applyLang()}
applyLang();
function ask(b){q.value=b.textContent;send()}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
// only autoscroll while the user is already near the bottom — otherwise
// streaming would keep yanking them back down while they read older messages
function autoscroll(force){
  if(force||chat.scrollHeight-chat.scrollTop-chat.clientHeight<140)chat.scrollTop=chat.scrollHeight}
function add(r,h){const d=document.createElement('div');d.className='msg '+r;d.innerHTML='<div class="b">'+(r==='user'?esc(h):h)+'</div>';chat.appendChild(d);autoscroll(r==='user');return d}
function resetChat(){convo=[];history.replaceState(null,'',location.pathname);document.querySelectorAll('.msg').forEach(m=>m.remove());wel.style.display='';q.focus()}
function mdfmt(a){
  return a.replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^# (.*)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function mdlite(raw){
  let a=esc(raw);
  a=a.replace(/\[(?:Quelle[n]?|Sources?)\s+[\d,\s und]+\]/g,'<span class="src-ref">$&</span>');
  return mdfmt(a)}
// answer_blocks -> HTML with span-level citation chips; chips reference the
// per-render citation array via data-i (wired up after innerHTML is set)
function renderBlocks(blocks,cites){
  let html='';
  blocks.forEach(b=>{
    const t=esc(b.text||'');
    if(b.citations&&b.citations.length){
      const chips=b.citations.map(c=>{
        cites.push(c);
        return '<button class="cite-chip'+(c.editorial?' ed':'')+'" data-i="'+(cites.length-1)+'" title="'+esc(c.cited_text?c.cited_text.slice(0,120):'')+'">'+c.index+'</button>';
      }).join('');
      html+='<span class="cited">'+t+'</span>'+chips;
    }else html+=t;
  });
  return mdfmt(html)}

// --- source panel -----------------------------------------------------------
const chunkCache={};
const DOCTYPE_META={diary:['#2c5530','Tagebuch','Diary'],letter:['#1d6fa5','Brief','Letter'],
  chronology:['#8a5a83','Chronologie','Chronology'],document:['#4a7d8c','Dokument','Document'],
  research_article:['#b8860b','Forschungsbeitrag','Research article'],
  editorial_note:['#8a6d1a','Editorischer Kommentar','Editorial note']};
function docTypeMeta(dt){
  if(DOCTYPE_META[dt])return DOCTYPE_META[dt];
  if((dt||'').startsWith('register_'))return['#667a68','Register','Register'];
  return['#667a68',dt||'',dt||'']}
function closePanel(){
  document.getElementById('spanel').classList.remove('open');
  document.getElementById('spanel').setAttribute('aria-hidden','true');
  document.getElementById('sp-backdrop').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
function highlightIn(raw,span){
  const flat=(raw||'').replace(/\s+/g,' ');
  if(!span)return esc(flat);
  const target=span.replace(/\s+/g,' ').trim();
  const idx=target?flat.toLowerCase().indexOf(target.toLowerCase()):-1;
  if(idx<0)return esc(flat);
  return esc(flat.slice(0,idx))+'<mark>'+esc(flat.slice(idx,idx+target.length))+'</mark>'+esc(flat.slice(idx+target.length))}
async function openPanel(cite){
  const t=T(),panel=document.getElementById('spanel');
  const badge=document.getElementById('sp-badge');
  const title=document.getElementById('sp-title'),meta=document.getElementById('sp-meta');
  const body=document.getElementById('sp-body'),foot=document.getElementById('sp-foot');
  badge.style.display='none';
  title.textContent=cite.citation_label||'';meta.textContent='';
  body.textContent=t.spLoading;foot.innerHTML='';
  panel.classList.add('open');panel.setAttribute('aria-hidden','false');
  document.getElementById('sp-backdrop').classList.add('open');
  let c=chunkCache[cite.chunk_id];
  if(!c){
    try{
      const r=await fetch(API+'/chunk/'+encodeURIComponent(cite.chunk_id));
      if(!r.ok)throw new Error();
      c=await r.json();chunkCache[cite.chunk_id]=c;
    }catch(e){body.textContent='⚠';return}
  }
  // header: doc-type badge, document title, date/folio
  const[bc,bde,ben]=docTypeMeta(c.doc_type);
  badge.textContent=LANG==='de'?bde:ben;badge.style.background=bc;badge.style.display='inline-block';
  title.textContent=(c.doc_title&&c.doc_title!==c.citation_label)?c.doc_title:(c.citation_label||'');
  meta.textContent=[c.date,(c.folio?('Bl. '+c.folio):''),
    (c.doc_title&&c.doc_title!==c.citation_label?c.citation_label:'')].filter(Boolean).join(' · ');
  body.innerHTML='';
  // cited-span hint + passage on a "paper" card
  const hasMainMark=!cite.editorial&&cite.cited_text;
  if(cite.cited_text){
    const h=document.createElement('div');h.className='sp-cith';h.textContent=t.spCited;body.appendChild(h);
  }
  const paper=document.createElement('div');paper.className='sp-paper';
  paper.innerHTML=highlightIn(c.text,hasMainMark?cite.cited_text:null);
  body.appendChild(paper);
  // editorial notes: collapsible, open when few or when the citation lives there
  const notes=c.editorial_notes||[];
  if(notes.length){
    const det=document.createElement('details');det.className='sp-notes';
    if(notes.length<=3||cite.editorial)det.open=true;
    det.innerHTML='<summary>'+esc(t.spNotes)+' ('+notes.length+')</summary>';
    notes.forEach(n=>{
      const d=document.createElement('div');d.className='nt';
      d.innerHTML=highlightIn(n,cite.editorial?cite.cited_text:null);
      det.appendChild(d);
    });
    body.appendChild(det);
  }
  if(c.source_desc){

function alen(x){
  if(Array.isArray(x))return x.length;
  if(typeof x==='string'){try{const p=JSON.parse(x);if(Array.isArray(p))return p.length}catch(e){}}
  return 0}
function argSummary(tool,inp){
  if(!inp)return'';
  if(tool==='search'){let s='„'+(inp.query||'')+'“';if(inp.doc_types)s+=' ['+inp.doc_types.join(',')+']';if(inp.date_from||inp.date_to)s+=' '+(inp.date_from||'')+'–'+(inp.date_to||'');return s}
  if(tool==='grep')return'/'+(inp.pattern||'')+'/';
  if(tool==='lookup_entity')return'„'+(inp.name||'')+'“'+(inp.entity_type?' ('+inp.entity_type+')':'');
  if(tool==='chunks_for_entity')return inp.humboldt_id||'';
  if(tool==='get_context')return inp.chunk_id||'';
  if(tool==='where_was_humboldt')return (inp.date_from||'')+(inp.date_to&&inp.date_to!==inp.date_from?' – '+inp.date_to:'');
  if(tool==='create_map')return'„'+(inp.title||'')+'“ ('+alen(inp.stations)+')';
  if(tool==='create_timeline')return'„'+(inp.title||'')+'“ ('+alen(inp.events)+')';
  if(tool==='create_network')return'„'+(inp.focus||'')+'“'+(inp.entity_types?' ['+inp.entity_types.join(',')+']':'');
  if(tool==='get_document')return inp.doc_id||'';
  if(tool==='query_measurements')return[inp.unit,inp.context_contains].filter(Boolean).join(' · ');
  if(tool==='code_execution')return(inp.code||'').split('\n').filter(l=>l.trim())[0]?.slice(0,60)||'';
  return JSON.stringify(inp)}

// --- gzip <-> base64url for share links ---
async function gzipB64(str){
  const stream=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf=new Uint8Array(await new Response(stream).arrayBuffer());
  let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function gunzipB64(b64){
  b64=b64.replace(/-/g,'+').replace(/_/g,'/');
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text()}

function citationFor(s){
  const t=T();const today=new Date().toISOString().slice(0,10);
  const label=s.doc_title?(s.doc_title+' ('+s.citation_label+')'):s.citation_label;
  return label+'. In: edition humboldt digital, hg. v. Ottmar Ette. Berlin-Brandenburgische Akademie der Wissenschaften, Berlin.'+(s.url?' '+s.url:'')+' ('+t.accessed+' '+today+').'}

const MON={de:['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'],
           en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
function yearOf(d){const m=/(\d{4})/.exec(d||'');return m?m[1]:''}
function eraColorMap(items,get){
  const map={};let i=0;
  (items||[]).forEach(it=>{const y=yearOf(get(it));if(y&&!(y in map))map[y]=ERA_COLORS[i++%ERA_COLORS.length]});

function shortDate(d){

  if(!m)return d||'';

// --- entity co-occurrence network (canvas force layout, no deps) ------------
const NET_COLORS={person:'#2c5530',place:'#1d6fa5',plant:'#6b8e23',institution:'#8a5a83',glossary:'#b8860b'};
const NET_TYPES={de:{person:'Person',place:'Ort',plant:'Pflanze',institution:'Institution',glossary:'Glossar'},
                 en:{person:'Person',place:'Place',plant:'Plant',institution:'Institution',glossary:'Glossary'}};
function renderNetwork(art,box){
  const wrap=document.createElement('div');wrap.style.position='relative';box.appendChild(wrap);
  const cv=document.createElement('canvas');cv.className='net-canvas';wrap.appendChild(cv);
  const tip=document.createElement('div');tip.className='net-tip';wrap.appendChild(tip);
  const lg=document.createElement('div');lg.className='net-legend';box.appendChild(lg);
  const nodes=(art.nodes||[]).map(n=>({...n}));
  const byId={};nodes.forEach(n=>byId[n.id]=n);
  const edges=(art.edges||[]).filter(e=>byId[e.source]&&byId[e.target]);
  [...new Set(nodes.map(n=>n.type))].forEach(tp=>{
    const s=document.createElement('span');
    s.innerHTML='<span class="dot" style="background:'+(NET_COLORS[tp]||'#777')+'"></span>'+esc((NET_TYPES[LANG]||NET_TYPES.de)[tp]||tp);
    lg.appendChild(s);
  });
  setTimeout(()=>{
    const W=cv.clientWidth||720,H=420,dpr=window.devicePixelRatio||1;
    cv.width=W*dpr;cv.height=H*dpr;
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const maxW=Math.max(...nodes.map(n=>n.weight||1),1);
    nodes.forEach((n,i)=>{
      n.r=n.focus?16:4+9*Math.sqrt((n.weight||1)/maxW);
      const a=2*Math.PI*i/Math.max(1,nodes.length-1);
      n.x=n.focus?W/2:W/2+170*Math.cos(a)+Math.random()*20;
      n.y=n.focus?H/2:H/2+130*Math.sin(a)+Math.random()*20;
      n.vx=0;n.vy=0;
    });
    const maxE=Math.max(...edges.map(e=>e.weight||1),1);
    let ticks=0,hover=null;
    function step(){
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);
        const f=1600/d2;dx/=d;dy/=d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
      }
      edges.forEach(e=>{
        const a=byId[e.source],b=byId[e.target];
        const rest=150-70*Math.sqrt((e.weight||1)/maxE);
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+0.01;
        const f=0.02*(d-rest)/d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
      });
      nodes.forEach(n=>{
        n.vx+=(W/2-n.x)*0.005;n.vy+=(H/2-n.y)*0.005;
        if(!n.focus){n.x+=n.vx*=0.85;n.y+=n.vy*=0.85}
        n.x=Math.max(n.r+2,Math.min(W-n.r-2,n.x));
        n.y=Math.max(n.r+2,Math.min(H-n.r-2,n.y));
      });
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.lineCap='round';
      edges.forEach(e=>{
        const a=byId[e.source],b=byId[e.target];
        ctx.strokeStyle='rgba(100,120,100,'+(0.12+0.3*(e.weight||1)/maxE)+')';
        ctx.lineWidth=0.5+2*(e.weight||1)/maxE;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      });
      const labeled=nodes.slice().sort((a,b)=>(b.r-a.r)).slice(0,14);
      nodes.forEach(n=>{
        ctx.fillStyle=NET_COLORS[n.type]||'#777';
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();
        if(n.focus||n===hover){ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1.5;ctx.stroke()}
      });
      ctx.font='11px Georgia,serif';ctx.textAlign='center';
      labeled.forEach(n=>{
        const label=n.label.length>24?n.label.slice(0,23)+'…':n.label;
        ctx.fillStyle='rgba(255,255,255,.75)';
        ctx.fillRect(n.x-ctx.measureText(label).width/2-2,n.y+n.r+3,ctx.measureText(label).width+4,13);
        ctx.fillStyle='#333';ctx.fillText(label,n.x,n.y+n.r+13);
      });
    }
    (function loop(){for(let k=0;k<3;k++)step();draw();if(++ticks<120)requestAnimationFrame(loop)})();
    cv.addEventListener('mousemove',ev=>{
      const rc=cv.getBoundingClientRect(),mx=ev.clientX-rc.left,my=ev.clientY-rc.top;
      hover=nodes.find(n=>(n.x-mx)**2+(n.y-my)**2<(n.r+3)**2)||null;
      cv.style.cursor=hover&&hover.url?'pointer':'default';
      if(hover){
        tip.textContent=hover.label+' · '+((NET_TYPES[LANG]||NET_TYPES.de)[hover.type]||hover.type)+(hover.focus?'':' · '+hover.weight);
        tip.style.left=Math.min(mx+12,W-160)+'px';tip.style.top=(my-24)+'px';tip.style.opacity='1';
      }else tip.style.opacity='0';
      draw();
    });
    cv.addEventListener('click',()=>{if(hover&&hover.url)window.open(hover.url,'_blank','noopener')});
  },50);
}

      }
      const cp=document.createElement('button');cp.className='copy-btn';cp.textContent='📋';cp.title=L2.citeTip;
      cp.onclick=async()=>{try{await navigator.clipboard.writeText(citationFor(s));cp.textContent='✓';cp.title=L2.citeCopied;setTimeout(()=>{cp.textContent='📋';cp.title=L2.citeTip},1500)}catch(e){}};
      line.appendChild(cp);line.appendChild(document.createElement('br'));
      src.appendChild(line);
    });
    bubble.appendChild(src);
  }
  (d.artifacts||[]).forEach(art=>renderArtifact(art,bubble));
  // share link
  const actions=document.createElement('div');actions.className='a-actions';
  const sh=document.createElement('button');sh.textContent=L2.share;
  sh.onclick=async()=>{
    try{
      const payload={q:queryText,data:{answer:d.answer,answer_blocks:d.answer_blocks,sources:d.sources,artifacts:d.artifacts,model:d.model,elapsed_s:d.elapsed_s}};
      const frag=await gzipB64(JSON.stringify(payload));
      await navigator.clipboard.writeText(location.origin+location.pathname+'#a='+frag);
      sh.textContent=L2.linkCopied;setTimeout(()=>sh.textContent=L2.share,2000);
    }catch(e){console.warn(e)}
  };
  actions.appendChild(sh);bubble.appendChild(actions);
  autoscroll();
}

function renderChips(bubble,questions){
  const L2=T();
  const wrap=document.createElement('div');wrap.className='chips';
  const lbl=document.createElement('span');lbl.style.cssText='font-size:.78rem;color:#888;align-self:center';lbl.textContent=L2.followups;wrap.appendChild(lbl);
  questions.forEach(qq=>{
    const b=document.createElement('button');b.textContent=qq;
    b.onclick=()=>{q.value=qq;send()};wrap.appendChild(b);
  });
  bubble.appendChild(wrap);autoscroll();
}

async function send(){
  const t=q.value.trim();if(!t)return;if(wel)wel.style.display='none';
  add('user',t);q.value='';btn.disabled=true;
  const L2=T();
  const bot=add('bot','');const bubble=bot.querySelector('.b');
  const traceEl=document.createElement('div');traceEl.className='trace';bubble.appendChild(traceEl);
  const live=document.createElement('div');live.className='live';bubble.appendChild(live);
  const think=document.createElement('div');think.className='typing';think.innerHTML='<span></span><span></span><span></span>';bubble.appendChild(think);
  let pendingLine=null,liveText='';
  try{
    const model=document.getElementById('model').value;
    const r=await fetch(API+'/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:t,model:model,history:convo.slice(-12)})});
    if(!r.ok){
      let msg='HTTP '+r.status;
      try{const e=await r.json();if(e.detail)msg=e.detail}catch(_){}
      throw new Error(msg);
    }
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,i);buf=buf.slice(i+2);
        if(!raw.startsWith('data: '))continue;
        handle(JSON.parse(raw.slice(6)));
      }
    }
  }catch(e){bubble.innerHTML=esc(L2.error+': '+e.message)}
  btn.disabled=false;q.focus();

  function handle(ev){
    if(ev.type==='tool_call'){
      // keep already-streamed text visible — it is part of the final answer
      if(liveText&&!liveText.endsWith('\n\n')){liveText+='\n\n';live.textContent=liveText}
      pendingLine=document.createElement('span');pendingLine.className='tl pending';
      pendingLine.innerHTML='<span class="tool">'+(L2.tools[ev.tool]||ev.tool)+'</span> <span class="args">'+esc(argSummary(ev.tool,ev.input))+'</span>';
      traceEl.appendChild(pendingLine);autoscroll();
    }else if(ev.type==='tool_result'){
      if(pendingLine){pendingLine.classList.remove('pending');
        const res=document.createElement('span');res.className='res';
        res.textContent=' → '+ev.n+' '+L2.hits+(ev.preview&&ev.preview.length?': '+ev.preview.slice(0,2).join(' · '):'');
        pendingLine.appendChild(res);pendingLine=null}
      autoscroll();
    }else if(ev.type==='live_reset'){
      liveText='';live.textContent='';
    }else if(ev.type==='answer_delta'){
      liveText+=ev.text;live.textContent=liveText;autoscroll();
    }else if(ev.type==='answer'){
      think.remove();
      renderAnswer(bubble,t,ev.data,traceEl);
      convo.push({role:'user',content:t},{role:'assistant',content:(ev.data.answer||'').slice(0,4000)});
      if(convo.length>12)convo=convo.slice(-12);
    }else if(ev.type==='suggestions'){
      renderChips(bubble,ev.questions||[]);
    }else if(ev.type==='error'){
      think.remove();bubble.innerHTML=esc(L2.error+': '+ev.message);
    }
  }
}

// shared-answer permalinks: #a=<gzip+base64url of {q, data}>
window.addEventListener('DOMContentLoaded',async()=>{
  if(!location.hash.startsWith('#a='))return;
  try{
    const payload=JSON.parse(await gunzipB64(location.hash.slice(3)));
    if(!payload||!payload.data)return;
    wel.style.display='none';
    add('user',payload.q||'');
    const bot=add('bot','');
    renderAnswer(bot.querySelector('.b'),payload.q||'',payload.data,null);
    convo=[{role:'user',content:payload.q||''},{role:'assistant',content:(payload.data.answer||'').slice(0,4000)}];
  }catch(e){console.warn('share link decode failed',e)}
});
</script>
