[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ehd-assistant"
dynamic = ["version"]
description = "Alex, the research assistant of the edition humboldt digital"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "openai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lxml>=5.0",
    "regex>=2024.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
alex = "alex.cli:main"

[tool.hatch.version]
path = "alex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["alex"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/mock_api.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
