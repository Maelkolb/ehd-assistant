version: "3.8"

services:
  # === RAG API ===
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - VECTOR_STORE=chroma
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_BACKEND=mock  # Change to "sentence-transformers" for real embeddings
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant  # Optional: only if using Qdrant

  # === Qdrant Vector DB (production alternative to ChromaDB) ===
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO

  # === Neo4j Knowledge Graph (optional, for structured queries) ===
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/humboldt2024
      - NEO4J_PLUGINS=["apoc"]

volumes:
  qdrant_data:
  neo4j_data:
